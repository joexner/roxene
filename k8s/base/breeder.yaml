apiVersion: apps/v1
kind: Deployment
metadata:
  name: breeder
  labels:
    app: breeder
spec:
  replicas: 1
  selector:
    matchLabels:
      app: breeder
  template:
    metadata:
      labels:
        app: breeder
      # Expose /metrics on :9101 so Prometheus (kubernetes_sd, role: pod) can scrape it
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9101"
    spec:
      containers:
        - name: breeder
          image: roxene:latest
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "roxene.tic_tac_toe", "--role", "breeder"]
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: roxene
                  key: DATABASE_URL
            - name: METRICS_PORT
              value: "9101"
          ports:
            - name: metrics
              containerPort: 9101
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              memory: 1Gi
