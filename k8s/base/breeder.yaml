apiVersion: apps/v1
kind: Deployment
metadata:
  name: breeder
  labels:
    app: breeder
spec:
  replicas: 1
  selector:
    matchLabels:
      app: breeder
  template:
    metadata:
      labels:
        app: breeder
      # Expose /metrics on :9101 so Prometheus (kubernetes_sd, role: pod) can scrape it
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9101"
    spec:
      serviceAccountName: breeder
      containers:
        - name: breeder
          image: roxene:latest
          imagePullPolicy: IfNotPresent
          # --wait_for_init blocks until the init Job has populated the pool.
          # run_breeder reads count_organisms() once at startup and derives
          # num_to_cull from it, so starting against an empty pool latches it
          # at the max(0, 5) floor -- silently wrong for the pod's whole life,
          # with no crash to show for it. See init_gate.py.
          command: ["python", "-m", "roxene.tic_tac_toe", "--role", "breeder", "--wait_for_init"]
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: roxene
                  key: DATABASE_URL
            - name: METRICS_PORT
              value: "9101"
          ports:
            - name: metrics
              containerPort: 9101
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              memory: 1Gi
