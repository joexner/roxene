apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards
  labels:
    app: grafana
data:
  dashboardproviders.yaml: "apiVersion: 1\nproviders:\n  - name: roxene\n    folder: Roxene\n    type: file\n    updateIntervalSeconds: 30\n    allowUiUpdates: true\n    options:\n      path: /etc/grafana/provisioning/dashboards\n      foldersFromFilesStructure: false\n"
  roxene-evolution.json: '{"uid": "roxene-evolution", "title": "Roxene - GA Evolution", "tags": ["roxene"], "timezone": "browser", "editable": true, "refresh": "10s", "schemaVersion": 39, "version": 1, "time": {"from": "now-1h", "to": "now"}, "panels": [{"id": 1, "type": "stat", "title": "Pool size", "description": "Living organisms in the pool. Read from the breeder only: workers also export roxene_pool_size (this gauge is refreshed in every pod running metrics.py) but always report 0, so an unrestricted query picks an arbitrary series and shows 0.", "gridPos": {"h": 4, "w": 6, "x": 0, "y": 0}, "datasource": {"type": "prometheus", "uid": "prometheus"}, "targets": [{"expr": "roxene_pool_size{app=\"breeder\"}", "refId": "A"}]}, {"id": 2, "type": "stat", "title": "Trials running", "description": "Trials in flight. Read from the breeder only; workers export the same gauge but always report 0.", "gridPos": {"h": 4, "w": 6, "x": 6, "y": 0}, "datasource": {"type": "prometheus", "uid": "prometheus"}, "targets": [{"expr": "roxene_trials_running{app=\"breeder\"}", "refId": "A"}]}, {"id": 3, "type": "stat", "title": "Trials / min", "gridPos": {"h": 4, "w": 6, "x": 12, "y": 0}, "datasource": {"type": "prometheus", "uid": "prometheus"}, "targets": [{"expr": "sum(rate(roxene_trials_completed_total[5m])) * 60", "refId": "A"}]}, {"id": 4, "type": "stat", "title": "Avg trial (s)", "gridPos": {"h": 4, "w": 6, "x": 18, "y": 0}, "datasource": {"type": "prometheus", "uid": "prometheus"}, "targets": [{"expr": "sum(rate(roxene_trial_duration_seconds_sum[5m])) / sum(rate(roxene_trial_duration_seconds_count[5m]))", "refId": "A"}]}, {"id": 5, "type": "timeseries", "title": "Outcomes over time (the learning signal)", "gridPos": {"h": 8, "w": 12, "x": 0, "y": 4}, "datasource": {"type": "prometheus", "uid": "prometheus"}, "targets": [{"expr": "sum by(outcome) (changes(roxene_outcomes_total[5m]))", "legendFormat": "{{outcome}}", "refId": "A"}], "fieldConfig": {"defaults": {"custom": {"fillOpacity": 25, "lineWidth": 1, "stacking": {"mode": "normal"}}}, "overrides": []}}, {"id": 7, "type": "timeseries", "title": "Trial duration (s)", "gridPos": {"h": 8, "w": 12, "x": 12, "y": 4}, "datasource": {"type": "prometheus", "uid": "prometheus"}, "targets": [{"expr": "histogram_quantile(0.5, sum(rate(roxene_trial_duration_seconds_bucket[5m])) by (le))", "legendFormat": "p50", "refId": "A"}, {"expr": "histogram_quantile(0.95, sum(rate(roxene_trial_duration_seconds_bucket[5m])) by (le))", "legendFormat": "p95", "refId": "B"}, {"expr": "sum(rate(roxene_trial_duration_seconds_sum[5m])) / sum(rate(roxene_trial_duration_seconds_count[5m]))", "legendFormat": "avg", "refId": "C"}]}, {"id": 8, "type": "timeseries", "title": "Breeding rate (organisms / min)", "gridPos": {"h": 8, "w": 24, "x": 0, "y": 12}, "datasource": {"type": "prometheus", "uid": "prometheus"}, "targets": [{"expr": "sum(rate(roxene_organisms_bred_total[5m])) * 60", "legendFormat": "bred", "refId": "A"}, {"expr": "sum(rate(roxene_organisms_culled_total[5m])) * 60", "legendFormat": "culled", "refId": "B"}]}, {"id": 9, "type": "row", "title": "Pod memory", "gridPos": {"h": 1, "w": 24, "x": 0, "y": 20}, "collapsed": false, "panels": []}, {"id": 10, "type": "stat", "title": "Workers memory (total)", "description": "Sum of working set across all worker StatefulSet pods. Working set excludes page cache, so this is what the OOM killer counts -- compare against the 8Gi limit on worker.yaml.", "gridPos": {"h": 4, "w": 6, "x": 0, "y": 21}, "datasource": {"type": "prometheus", "uid": "prometheus"}, "targets": [{"expr": "sum(container_memory_working_set_bytes{namespace=\"roxene\", pod=~\"worker-.*\", container!=\"\"})", "refId": "A"}], "fieldConfig": {"defaults": {"unit": "bytes", "color": {"mode": "thresholds"}, "thresholds": {"mode": "absolute", "steps": [{"color": "green", "value": null}, {"color": "orange", "value": 6442450944}, {"color": "red", "value": 8589934592}]}}, "overrides": []}}, {"id": 11, "type": "stat", "title": "Breeder memory", "description": "Working set for the single breeder pod. Limit is 1Gi (breeder.yaml); the 512Mi request is the scheduling floor, not a ceiling.", "gridPos": {"h": 4, "w": 6, "x": 6, "y": 21}, "datasource": {"type": "prometheus", "uid": "prometheus"}, "targets": [{"expr": "sum(container_memory_working_set_bytes{namespace=\"roxene\", pod=~\"breeder-.*\", container!=\"\"})", "refId": "A"}], "fieldConfig": {"defaults": {"unit": "bytes", "color": {"mode": "thresholds"}, "thresholds": {"mode": "absolute", "steps": [{"color": "green", "value": null}, {"color": "orange", "value": 805306368}, {"color": "red", "value": 966367641}]}}, "overrides": []}}, {"id": 12, "type": "stat", "title": "Namespace memory (total)", "description": "Working set across every running pod in roxene, including the observability stack.", "gridPos": {"h": 4, "w": 6, "x": 12, "y": 21}, "datasource": {"type": "prometheus", "uid": "prometheus"}, "targets": [{"expr": "sum(container_memory_working_set_bytes{namespace=\"roxene\", container!=\"\"})", "refId": "A"}], "fieldConfig": {"defaults": {"unit": "bytes"}, "overrides": []}}, {"id": 13, "type": "stat", "title": "Pods near OOM", "description": "Count of worker/breeder pods above 90% of their memory limit (8Gi / 1Gi). Thresholds are hardcoded here because kube-state-metrics is not deployed -- if you change the limits in worker.yaml or breeder.yaml, update this expression too.", "gridPos": {"h": 4, "w": 6, "x": 18, "y": 21}, "datasource": {"type": "prometheus", "uid": "prometheus"}, "targets": [{"expr": "count((sum by (pod) (container_memory_working_set_bytes{namespace=\"roxene\", pod=~\"worker-.*\", container!=\"\"}) > 0.9 * 8589934592) or (sum by (pod) (container_memory_working_set_bytes{namespace=\"roxene\", pod=~\"breeder-.*\", container!=\"\"}) > 0.9 * 1073741824)) or vector(0)", "refId": "A"}], "fieldConfig": {"defaults": {"color": {"mode": "thresholds"}, "thresholds": {"mode": "absolute", "steps": [{"color": "green", "value": null}, {"color": "red", "value": 1}]}}, "overrides": []}}, {"id": 14, "type": "timeseries", "title": "Worker memory working set", "description": "Per-pod working set over time. Flat plateaus are normal; a steady climb is a leak.", "gridPos": {"h": 8, "w": 12, "x": 0, "y": 25}, "datasource": {"type": "prometheus", "uid": "prometheus"}, "targets": [{"expr": "sum by (pod) (container_memory_working_set_bytes{namespace=\"roxene\", pod=~\"worker-.*\", container!=\"\"})", "legendFormat": "{{pod}}", "refId": "A"}], "fieldConfig": {"defaults": {"unit": "bytes", "custom": {"fillOpacity": 20, "lineWidth": 1}}, "overrides": []}}, {"id": 15, "type": "timeseries", "title": "Memory vs limit (% of limit)", "description": "Working set as a percentage of the configured memory limit -- 8Gi for workers, 1Gi for breeder. 100% means OOM-kill. Limits are hardcoded (no kube-state-metrics); update here if worker.yaml/breeder.yaml change.", "gridPos": {"h": 8, "w": 12, "x": 12, "y": 25}, "datasource": {"type": "prometheus", "uid": "prometheus"}, "targets": [{"expr": "100 * sum by (pod) (container_memory_working_set_bytes{namespace=\"roxene\", pod=~\"worker-.*\", container!=\"\"}) / 8589934592", "legendFormat": "{{pod}}", "refId": "A"}, {"expr": "100 * sum by (pod) (container_memory_working_set_bytes{namespace=\"roxene\", pod=~\"breeder-.*\", container!=\"\"}) / 1073741824", "legendFormat": "{{pod}}", "refId": "B"}], "fieldConfig": {"defaults": {"unit": "percent", "min": 0, "custom": {"fillOpacity": 15, "lineWidth": 1}, "thresholds": {"mode": "absolute", "steps": [{"color": "green", "value": null}, {"color": "orange", "value": 80}, {"color": "red", "value": 95}]}}, "overrides": []}}], "templating": {"list": []}}'
