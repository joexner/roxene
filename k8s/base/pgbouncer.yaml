apiVersion: v1
kind: ConfigMap
metadata:
  name: pgbouncer
data:
  pgbouncer.ini: |
    [databases]
    roxene = host=postgres port=5432 dbname=roxene

    [pgbouncer]
    listen_addr = 0.0.0.0
    listen_port = 6432
    pool_mode = transaction
    ; 20 workers x 2 pool connections + breeder + notebook + reaper headroom
    max_client_conn = 200
    default_pool_size = 50
    ; In-cluster, so clients don't authenticate (auth_type = trust).
    ; pgbouncer's own credentials for connecting to Postgres come from the
    ; DB_USER/DB_PASSWORD env vars, which the entrypoint writes into
    ; userlist.txt. There is no auth_password parameter -- that is not a
    ; real pgbouncer setting and makes it refuse to load the config file.
    auth_type = trust
    ; Without an explicit auth_file pgbouncer loads no credentials at all, and
    ; even auth_type=trust needs the user present to get its server password.
    ; The entrypoint populates this file from DB_USER/DB_PASSWORD.
    auth_file = /etc/pgbouncer/userlist.txt
    admin_users = postgres
    ignore_startup_parameters = extra_float_digits
---
apiVersion: v1
kind: Service
metadata:
  name: pgbouncer
  labels:
    app: pgbouncer
spec:
  selector:
    app: pgbouncer
  ports:
    - name: pgbouncer
      port: 6432
      targetPort: 6432
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pgbouncer
  labels:
    app: pgbouncer
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pgbouncer
  template:
    metadata:
      labels:
        app: pgbouncer
    spec:
      containers:
        - name: pgbouncer
          image: edoburu/pgbouncer:v1.23.1-p3
          env:
            # The image's entrypoint writes these into userlist.txt so pgbouncer
            # can authenticate to Postgres. Without them it has no password to
            # open server connections with.
            - name: DB_USER
              value: postgres
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: roxene
                  key: POSTGRES_PASSWORD
            # Store the password as plaintext rather than an md5 digest, so
            # pgbouncer can do SCRAM against Postgres 16 (which defaults to
            # scram-sha-256). Only affects userlist.txt, not auth_type.
            - name: AUTH_TYPE
              value: scram-sha-256
          ports:
            - name: pgbouncer
              containerPort: 6432
          readinessProbe:
            tcpSocket:
              port: 6432
            initialDelaySeconds: 3
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
          volumeMounts:
            # Mount only the ini file. Mounting the whole ConfigMap at
            # /etc/pgbouncer makes that directory read-only, and the image's
            # entrypoint needs to create userlist.txt inside it at startup.
            - name: config
              mountPath: /etc/pgbouncer/pgbouncer.ini
              subPath: pgbouncer.ini
      volumes:
        - name: config
          configMap:
            name: pgbouncer
