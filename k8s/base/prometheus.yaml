# Prometheus scrapes the app's /metrics endpoints (discovered via k8s SD on the
# prometheus.io/* annotations on the worker/breeder pods) plus the observability
# stack's own /metrics. Access with:
#   kubectl -n roxene port-forward svc/prometheus 9090:9090
apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus
  labels:
    app: prometheus
---
# Needed for kubernetes_sd (role: pod) to discover scrape targets by label.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: prometheus
  labels:
    app: prometheus
rules:
  - apiGroups: [""]
    resources: ["pods", "services"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: prometheus
  labels:
    app: prometheus
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: prometheus
subjects:
  - kind: ServiceAccount
    name: prometheus
    namespace: roxene
---
# Container-level memory/CPU comes from kubelet's cAdvisor, reached via the
# /api/v1/nodes/<node>/proxy/metrics/cadvisor subresource. Nodes are
# cluster-scoped, so this must be a ClusterRole -- the Role above only covers
# pods/services inside roxene and cannot grant node access.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: prometheus-cadvisor
  labels:
    app: prometheus
rules:
  - apiGroups: [""]
    resources: ["nodes", "nodes/proxy", "nodes/metrics"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: prometheus-cadvisor
  labels:
    app: prometheus
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: prometheus-cadvisor
subjects:
  - kind: ServiceAccount
    name: prometheus
    namespace: roxene
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus
  labels:
    app: prometheus
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s
    scrape_configs:
      # App metrics: any pod in this namespace annotated prometheus.io/scrape=true
      - job_name: roxene-app
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names: [roxene]
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
            action: keep
            regex: "true"
          # Strip any port already present on __address__ (pods that declare a
          # containerPort get podIP:port) before applying the annotation port,
          # otherwise the target ends up as podIP:port:port.
          - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
            action: replace
            regex: ([^:]+)(?::\d+)?;(\d+)
            replacement: $1:$2
            target_label: __address__
          - source_labels: [__meta_kubernetes_namespace]
            action: replace
            target_label: namespace
          - source_labels: [__meta_kubernetes_pod_name]
            action: replace
            target_label: pod
          - source_labels: [__meta_kubernetes_pod_label_app]
            action: replace
            target_label: app
      # Container memory/CPU from kubelet's cAdvisor. This is what backs
      # container_memory_working_set_bytes -- the pod /metrics endpoints above
      # only expose app-level gauges and carry no container resource data.
      # Discovered per node, then rewritten to hit the API server's node proxy
      # subresource rather than the kubelet directly (works on minikube and GKE
      # alike, and needs no hostNetwork or kubelet cert juggling).
      - job_name: kubernetes-cadvisor
        scheme: https
        tls_config:
          ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
          insecure_skip_verify: true
        authorization:
          credentials_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        kubernetes_sd_configs:
          - role: node
        relabel_configs:
          - target_label: __address__
            replacement: kubernetes.default.svc:443
          - source_labels: [__meta_kubernetes_node_name]
            regex: (.+)
            target_label: __metrics_path__
            replacement: /api/v1/nodes/$1/proxy/metrics/cadvisor
          - source_labels: [__meta_kubernetes_node_name]
            target_label: node
          - source_labels: [__meta_kubernetes_node_name]
            target_label: instance
        # cAdvisor emits container="" (pod sandbox aggregate) and container="POD"
        # (pause container) alongside the real containers. Both are near-zero and
        # inflate/duplicate any sum, so filter them out at scrape time.
        metric_relabel_configs:
          - source_labels: [container]
            action: drop
            regex: ""
          - source_labels: [container]
            action: drop
            regex: POD
      # The observability stack's own metrics
      - job_name: observability
        static_configs:
          - targets: ["prometheus:9090", "grafana:3000", "loki:3100", "alloy:12345"]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  labels:
    app: prometheus
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      serviceAccountName: prometheus
      containers:
        - name: prometheus
          image: prom/prometheus:v2.53.0
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            - --storage.tsdb.retention.time=7d
            - --web.enable-lifecycle
          ports:
            - name: web
              containerPort: 9090
          readinessProbe:
            httpGet:
              path: /-/ready
              port: 9090
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
            - name: data
              mountPath: /prometheus
      volumes:
        - name: config
          configMap:
            name: prometheus
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  labels:
    app: prometheus
spec:
  selector:
    app: prometheus
  ports:
    - name: web
      port: 9090
      targetPort: 9090
