# Dev-only credentials; the whole point of this stack is that it runs on a
# personal cluster. For anything shared, move these to a sealed/external secret.
apiVersion: v1
kind: Secret
metadata:
  name: roxene
type: Opaque
stringData:
  DATABASE_URL: "postgresql+psycopg2://postgres:postgres@pgbouncer:6432/roxene"
  POSTGRES_PASSWORD: "postgres"
  JUPYTER_TOKEN: "roxene-dev"
