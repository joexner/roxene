# The workers poll `kubectl get job init` (init_gate.py) so they don't start
# running trials against an empty pool. The default ServiceAccount in a namespace
# has no RBAC at all, so the get would fail with 403 and the gate would wait
# forever. Grant only what the gate needs: read the one Job, nothing else.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: worker
  labels:
    app: worker
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: wait-for-init
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    # Scoped to the single Job the gate waits on. Omitting resourceNames
    # would let these pods read every Job in the namespace.
    resourceNames: ["init"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: worker
  labels:
    app: worker
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: wait-for-init
subjects:
  - kind: ServiceAccount
    name: worker
    namespace: roxene

