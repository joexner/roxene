apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: worker
  labels:
    app: worker
spec:
  serviceName: worker
  replicas: 4
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
      annotations:
        prometheus.io/scrape: 'true'
        prometheus.io/port: '9101'
    spec:
      terminationGracePeriodSeconds: 60
      serviceAccountName: worker
      containers:
        - name: worker
          image: roxene:latest
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "roxene.tic_tac_toe", "--role", "worker", "--num_threads", "5", "--husbandry_rate", "0.02", "--wait_for_init"]
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: roxene
                  key: DATABASE_URL
            - name: METRICS_PORT
              value: '9101'
          ports:
            - name: metrics
              containerPort: 9101
          resources:
            requests:
              cpu: 2000m
              memory: 2Gi
            limits:
              memory: 4Gi
  updateStrategy:
    type: RollingUpdate
