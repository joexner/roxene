# Small footprint for a local kind cluster
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base
  - worker-cpu.yaml

patches:
  - path: worker-memory-patch.yaml
  - path: worker-rocm-patch.yaml

images:
  # The CPU worker uses a qualified image name to avoid this ROCm rewrite.
  - name: roxene
    newName: roxene-rocm
    newTag: latest

replicas:
  # One GPU in the box, so one worker pod -- it uses threads to fill it.
  - name: worker
    count: 1
  - name: worker-cpu
    count: 1
