# Small footprint for a local kind cluster
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

patches:
  - path: worker-memory-patch.yaml
  - path: worker-rocm-patch.yaml

images:
#   ROCm build of the app, so the worker can run the organisms on the GPU.
  - name: roxene
    newName: roxene-rocm
    newTag: latest

replicas:
  # One GPU in the box, so one worker pod -- it uses threads to fill it.
  - name: worker
    count: 1
