# Local workers each use 10 threads and reserve at most 8Gi of memory.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: worker
  namespace: roxene
spec:
  template:
    spec:
      containers:
        - name: worker
          command: ["python", "-m", "roxene.tic_tac_toe", "--role", "worker", "--num_threads", "10", "--wait_for_init"]
          resources:
            requests:
              cpu: 2000m
              memory: 8Gi
            limits:
              memory: 8Gi
