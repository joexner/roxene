# GKE with a spot (preemptible) worker pool.
#
# Create the pool first:
#   gcloud container node-pools create roxene-spot \
#     --cluster <cluster> --location us-central1 \
#     --spot --num-nodes 2 --machine-type e2-medium
#
# Workers are pinned to spot nodes; Postgres, pgbouncer and the notebook stay
# on regular nodes. Cull+breed now runs inside the workers, so it rides along.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

patches:
  - path: worker-spot-patch.yaml

images:
  - name: roxene
    newName: us-central1-docker.pkg.dev/joexner/roxene/roxene
    newTag: latest
  - name: roxene-notebook
    newName: us-central1-docker.pkg.dev/joexner/roxene/roxene-notebook
    newTag: latest
