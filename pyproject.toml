[project]
name = "roxene"
version = "0.1.0"
description = "A genetic algorithm project for evolving neural networks"
requires-python = ">=3.12"
dependencies = [
    "torch>=2.15.0",
    "numpy>=2.5.4",
    "sqlalchemy>=2.1.8",
    "pg8000>=1.31.6",
    "prometheus-client>=0.26.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.2.0",
    "parameterized>=0.9.0",
    "testcase>=0.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/roxene"]

[tool.pytest.ini_options]
addopts = [
    "--import-mode=importlib",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]
log_cli = true
log_cli_level = "DEBUG"
log_cli_format = "%(asctime)s - %(levelname)s - %(name)s - %(message)s"
log_date_format = "%H:%M:%S.%f"
